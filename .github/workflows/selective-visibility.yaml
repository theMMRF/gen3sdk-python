name: Selective visibility
on:
  pull_request:
  push:
    branches: [feature/selective-file-visibility, feature/selective-file-visibility-13.1]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    env:
      VISIBILITY_TEST_ES_URL: http://localhost:9200
      PROMETHEUS_MULTIPROC_DIR: /tmp/visibility-metrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install poetry==2.2.1
      - run: poetry install --no-interaction
      - run: poetry run pytest --noconftest tests/test_index_visibility.py
